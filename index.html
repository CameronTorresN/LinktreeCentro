<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Cam Torres Linktree</title>
    <meta
      name="description"
      content="Cam Torres — Designer, Developer, and Creative based in CDMX. Explore projects, apps, and experiments."
    />
    <meta name="author" content="Cam Torres" />
    <meta name="theme-color" content="#ede8dc" />

    <!-- Open Graph -->
    <meta property="og:title" content="Cam Torres" />
    <meta
      property="og:description"
      content="Designer · Developer · Creative — Explore my work and projects."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://camerontorresn.github.io/LinktreeCentro/"
    />
    <meta
      property="og:image"
      content="https://camerontorresn.github.io/LinktreeCentro/preview.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cam Torres" />
    <meta
      name="twitter:description"
      content="Designer · Developer · Creative — Explore my work."
    />
    <meta
      name="twitter:image"
      content="https://camerontorresn.github.io/LinktreeCentro/preview.png"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- ── HEADER / HERO ── -->
    <header class="hero">
      <img src="Cam.png" alt="Portrait of Cam Torres" />
      <div class="hero-fade"></div>
    </header>

    <!-- ── MAIN CONTENT ── -->
    <main class="container">
      <!-- IDENTITY -->
      <section class="identity">
        <h1 class="name">Cam <em>Torres</em></h1>
        <p class="bio">Designer · Developer · Creative · CDMX</p>

        <!-- CTA -->
        <a
          href="https://camtorres.com"
          class="social-btn"
          target="_blank"
          rel="noopener noreferrer"
        >
          View Portfolio
        </a>
      </section>

      <!-- NAV (SOCIALS) -->
      <nav class="socials" aria-label="Social links">
        <a
          href="https://www.instagram.com/camtorresn/"
          class="social-btn"
          target="_blank"
          rel="noopener noreferrer"
        >
          Instagram
        </a>

        <a
          href="https://github.com/CameronTorresN"
          class="social-btn"
          target="_blank"
          rel="noopener noreferrer"
        >
          GitHub
        </a>

        <a
          href="https://www.linkedin.com/in/cameron-torres-424501284/"
          class="social-btn"
          target="_blank"
          rel="noopener noreferrer"
        >
          LinkedIn
        </a>

        <a href="mailto:camtorresnunez@gmail.com" class="social-btn">
          Email
        </a>
        
        <a
          href="https://wa.me/528148114687"
          class="social-btn"
          target="_blank"
          rel="noopener noreferrer"
        >
          WhatsApp
        </a>
      </nav>

      <div class="rule"></div>

      <!-- WORK -->
      <section>
        <span class="section-label">Work</span>

        <div class="links">
          <a
            href="https://camtorres.com"
            class="link-item orange"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-label">Portfolio</span>
            <span class="link-arrow">→</span>
          </a>

          <a href="#" class="link-item">
            <span class="link-label">CV / Résumé</span>
            <span class="link-arrow">→</span>
          </a>
        </div>
      </section>

      <!-- PROJECTS -->
      <section>
        <span class="section-label">Projects</span>

        <div class="links">
          <a
            href="https://letters-pi-three.vercel.app"
            class="link-item sky"
            target="_blank"
            rel="noopener noreferrer"
          >
            <span class="link-label">For Ella, From Cam</span>
            <span class="link-arrow">→</span>
          </a>

          <a href="#" class="link-item">
            <span class="link-label">Timely — iOS App</span>
            <span class="link-arrow">→</span>
          </a>

          <a href="#" class="link-item">
            <span class="link-label">Your Universe</span>
            <span class="link-arrow">→</span>
          </a>
        </div>
      </section>

      <!-- FOOTER -->
      <footer class="footer">
        © 2026 Cameron Torres Núñez
      </footer>
    </main>

    <div class="bottom-bar"></div>
  </body>
</html>
